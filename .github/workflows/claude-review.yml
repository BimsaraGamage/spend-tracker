name: Claude review

# Automated AI review that follows docs/pr-review.md and cites rule IDs from
# docs/engineering-standards.md.
#
# It stays inactive until the maintainer adds a CLAUDE_CODE_OAUTH_TOKEN or an
# ANTHROPIC_API_KEY secret (docs/operations/ai-review.md). It reviews only
# non-draft PRs opened by people from branches in this repository: fork PRs
# never receive secrets, and a personal subscription token is meant for the
# maintainer's own work. It is read-only apart from posting review comments.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # read the code under review
      pull-requests: write # post the review as PR comments
    steps:
      - name: Check that a review credential is configured
        id: credential
        env:
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "${HAS_OAUTH_TOKEN}" = "true" ] || [ "${HAS_API_KEY}" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret is configured. See docs/operations/ai-review.md."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credential.outputs.configured == 'true'
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Review the pull request
        if: steps.credential.outputs.configured == 'true'
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        with:
          # Whichever credential exists is used; an empty one counts as unset.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request.
            First read AGENTS.md, docs/engineering-standards.md and docs/pr-review.md.
            Follow R1 to R6 of docs/pr-review.md: use the full diff, read the unchanged
            code the change depends on, walk the R3 checklist in order, and keep a
            finding only if you can state a concrete trigger.
            Answer in the R5 output format, citing rule IDs. Use inline comments for
            findings tied to specific lines.
            You are read-only: never push, approve, merge or change anything.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
