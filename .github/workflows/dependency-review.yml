name: Dependency review

on:
  pull_request:

permissions: {}

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block known high and critical vulnerabilities in runtime and
          # build-time dependencies. Lower severities surface as Dependabot alerts.
          fail-on-severity: high
          fail-on-scopes: runtime, development
          # Advisories with no fixed version yet, accepted after review. Each
          # one is explained in docs/operations/dependency-updates.md; remove
          # it as soon as a fix is released.
          allow-ghsas: GHSA-vfj7-8cjw-p6xm, GHSA-86w9-cpqp-85rv
          # Only licenses compatible with distributing the app under
          # Apache-2.0, including through app stores. Copyleft licenses
          # (GPL, AGPL, LGPL, SSPL) and source-available licenses are not
          # allowed without a deliberate exception.
          allow-licenses: >-
            0BSD, Apache-2.0, BlueOak-1.0.0, BSD-2-Clause, BSD-3-Clause,
            CC-BY-3.0, CC-BY-4.0, CC0-1.0, ISC, MIT, MIT-0, MPL-2.0,
            Python-2.0, Unlicense, Zlib
