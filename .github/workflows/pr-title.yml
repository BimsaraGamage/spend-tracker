name: PR title

# Squash merges turn the PR title into the commit message on main, and
# release-please builds the changelog from it, so the title must follow
# Conventional Commits.
#
# Uses `pull_request`, never `pull_request_target`, so code from forks never
# runs with write access or secrets.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the PR title
        # The title is untrusted input. Pass it through an environment variable,
        # never by interpolating it into the script.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*[^. ]$'
          printf 'PR title: %s\n' "${TITLE}"
          if [[ ! "${TITLE}" =~ ${pattern} ]]; then
            echo "::error title=PR title::Use Conventional Commits, for example 'feat(app): add transaction list'. See CONTRIBUTING.md."
            exit 1
          fi
